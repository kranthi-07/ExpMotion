<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Parallax Layers - EXP MOTION</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <div id="parallax-container">
    <div class="parallax-wrapper">
      
      <!-- Layer 1: Background Blur / Grid -->
      <div class="layer layer-1" id="layer-1">
        <div class="layer-1-blob"></div>
      </div>

      <!-- Layer 2: Text / Content -->
      <div class="layer layer-2" id="layer-2">
        <h4>Parallax</h4>
        <p>Multi-layered depth</p>
      </div>

      <!-- Layer 3: Foreground floating elements -->
      <div class="layer layer-3" id="layer-3">
        <div class="layer-3-shape-1"></div>
        <div class="layer-3-shape-2"></div>
      </div>
      
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
